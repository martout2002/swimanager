<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim school platform — mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy:#0A3D5C;
    --navy-ink:#082E45;
    --blue:#1B7FA8;
    --blue-pale:#EAF3F6;
    --coral:#FF6B4A;
    --coral-dark:#E24F2C;
    --green:#1F9E82;
    --green-pale:#E4F5F1;
    --amber:#C97F12;
    --amber-pale:#FBF0DD;
    --red:#C24444;
    --red-pale:#FBEBEB;
    --ink:#122029;
    --slate:#5C6E76;
    --line:#DCE6EA;
    --bg:#F1F6F7;
    --white:#FFFFFF;
    --font-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
  p{margin:0;}

  /* ---------- meta / prototype bar ---------- */
  .meta-bar{
    background:var(--navy-ink); color:#DCEBF2; padding:12px 18px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px;
  }
  .meta-bar .meta-label{color:#8FB4C6;}
  .seg{display:inline-flex; background:rgba(255,255,255,.08); border-radius:9px; padding:3px; gap:2px;}
  .seg button{border:0; background:transparent; color:#B9D2DE; padding:7px 14px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;}
  .seg button.active{background:#fff; color:var(--navy-ink); font-weight:600;}
  .meta-note{margin-left:auto; color:#7FA3B6; font-size:12px; max-width:360px; text-align:right;}

  .stage{padding:32px 16px 80px; display:flex; justify-content:center;}

  /* ---------- lane divider motif ---------- */
  .lane-divider{display:flex; gap:5px; margin:18px 0; align-items:center;}
  .lane-divider span{flex:1; height:2px; background:repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px);}

  /* ---------- phone frame (instructor + parent) ---------- */
  .phone{width:100%; max-width:404px; background:#fff; border-radius:22px; box-shadow:0 16px 40px rgba(9,45,66,.14); border:1px solid var(--line); overflow:hidden;}
  .phone-status{display:flex; justify-content:space-between; align-items:center; padding:9px 16px; font-size:12px; color:var(--slate); background:var(--blue-pale); border-bottom:1px solid var(--line);}
  .sync-pill{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; border-radius:99px; padding:4px 10px; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--ink);}
  .sync-dot{width:7px;height:7px;border-radius:50%; background:var(--green);}
  .sync-pill.offline .sync-dot{background:var(--amber);}
  .offline-banner{background:var(--amber-pale); color:#8A5A0B; font-size:12.5px; padding:9px 16px; border-bottom:1px solid var(--line);}
  .phone-header{padding:18px 18px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  .back-btn{border:0; background:var(--blue-pale); color:var(--navy); width:34px; height:34px; border-radius:10px; display:grid; place-items:center; cursor:pointer; flex-shrink:0;}
  .phone-header h2{font-size:19px; color:var(--navy);}
  .phone-header .sub{font-size:12.5px; color:var(--slate); margin-top:2px;}
  .phone-body{padding:16px 18px 22px;}

  /* ---------- generic elements ---------- */
  .kicker{font-size:12px; color:var(--slate); margin-bottom:4px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px;}
  .card + .card{margin-top:10px;}
  .btn{border:0; border-radius:10px; padding:12px 16px; font-size:14.5px; font-weight:600; cursor:pointer; min-height:48px;}
  .btn-coral{background:var(--coral); color:#fff;}
  .btn-coral:hover{background:var(--coral-dark);}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--ink);}
  .btn-block{width:100%; display:block;}
  .btn-sm{padding:8px 12px; font-size:13px; min-height:38px; border-radius:8px;}
  .pill{display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:4px 11px; font-size:12px; font-weight:600;}
  .pill-green{background:var(--green-pale); color:var(--green);}
  .pill-amber{background:var(--amber-pale); color:var(--amber);}
  .pill-red{background:var(--red-pale); color:var(--red);}
  .pill-slate{background:#EDF2F3; color:var(--slate);}

  /* ---------- class list (instructor: today) ---------- */
  .class-card{width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .class-card:hover{border-color:var(--blue);}
  .class-card + .class-card{margin-top:10px;}
  .class-time{font-family:var(--font-display); font-weight:600; color:var(--navy); font-size:16px;}
  .class-meta{font-size:12.5px; color:var(--slate); margin-top:3px;}
  .class-count{background:var(--blue-pale); color:var(--navy); font-size:12px; font-weight:700; border-radius:99px; width:30px; height:30px; display:grid; place-items:center; flex-shrink:0;}

  /* ---------- roster / attendance ---------- */
  .student-row{border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .student-row .name-line{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .student-row .name{font-weight:700; font-size:15px;}
  .student-row .level{font-size:12px; color:var(--slate);}
  .status-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px;}
  .status-btn{border:1.5px solid var(--line); background:#fff; border-radius:9px; padding:9px 4px; font-size:11.5px; font-weight:600; color:var(--slate); cursor:pointer; min-height:44px;}
  .status-btn.on-present{background:var(--green-pale); border-color:var(--green); color:var(--green);}
  .status-btn.on-absent_notified{background:var(--amber-pale); border-color:var(--amber); color:var(--amber);}
  .status-btn.on-absent_no_show{background:var(--red-pale); border-color:var(--red); color:var(--red);}
  .status-btn.on-cancelled_instructor, .status-btn.on-cancelled_weather{background:#EDF2F3; border-color:var(--slate); color:var(--slate);}
  .status-btn.on-makeup{background:var(--blue-pale); border-color:var(--blue); color:var(--blue);}
  .assess-link{width:100%; background:var(--blue-pale); color:var(--navy); border:0; border-radius:9px; padding:10px; font-size:13px; font-weight:600; cursor:pointer;}

  /* ---------- progress ring ---------- */
  .ring-wrap{position:relative; width:64px; height:64px; flex-shrink:0;}
  .ring{width:64px; height:64px; border-radius:50%; background:conic-gradient(var(--ring-color, var(--green)) calc(var(--pct) * 3.6deg), #E7EEF0 0deg);}
  .ring-hole{position:absolute; inset:6px; background:#fff; border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink);}

  /* ---------- assessment screen ---------- */
  .ready-banner{background:var(--green); color:#fff; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .sequence{margin-bottom:18px;}
  .sequence-title{font-size:13px; font-weight:700; text-transform:none; color:var(--navy); margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline;}
  .sequence-title .pct{color:var(--slate); font-weight:600; font-size:12px;}
  .criterion{border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:8px;}
  .crit-top{display:flex; align-items:flex-start; gap:9px;}
  .crit-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line); flex-shrink:0; display:grid; place-items:center; cursor:pointer; color:#fff; margin-top:1px;}
  .crit-check.checked{background:var(--green); border-color:var(--green);}
  .crit-text{font-size:13.5px; line-height:1.4; flex:1;}
  .crit-lock{color:var(--slate); flex-shrink:0; margin-top:2px;}
  .verify-tag{display:inline-block; margin-top:5px; font-size:10.5px; color:var(--amber); background:var(--amber-pale); border-radius:6px; padding:2px 7px; font-weight:600;}
  .sub-block{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .sub-block-label{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--blue); font-weight:700; margin-bottom:8px;}
  .sub-row{display:flex; align-items:center; gap:9px; padding:5px 0;}
  .sub-check{width:19px;height:19px;border-radius:5px;border:2px solid var(--line); flex-shrink:0; display:grid; place-items:center; cursor:pointer; color:#fff;}
  .sub-check.checked{background:var(--blue); border-color:var(--blue);}
  .sub-text{font-size:12.5px; flex:1;}
  .sub-weight{font-size:10.5px; color:var(--slate); background:#EDF2F3; border-radius:5px; padding:1px 6px;}
  .crit-pct-tag{font-size:11.5px; font-weight:700; color:var(--slate); margin-left:31px; margin-top:4px;}
  .timed-row{display:flex; align-items:center; gap:8px; margin-top:8px; margin-left:31px;}
  .timed-row input{width:70px; border:1.5px solid var(--line); border-radius:7px; padding:6px 8px; font-size:13px; font-family:inherit;}
  .timed-row .threshold{font-size:11.5px; color:var(--slate);}

  /* ---------- parent portal ---------- */
  .child-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .child-tab{flex:1; border:1.5px solid var(--line); background:#fff; border-radius:11px; padding:10px; cursor:pointer; text-align:center;}
  .child-tab.active{border-color:var(--navy); background:var(--blue-pale);}
  .child-tab .cname{font-weight:700; font-size:13.5px;}
  .child-tab .clevel{font-size:11px; color:var(--slate);}
  .stage-summary{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .stage-summary .sname{font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--navy);}
  .stage-summary .scaption{font-size:12.5px; color:var(--slate); margin-top:2px;}
  .lesson-note{font-size:13px; line-height:1.5;}
  .lesson-note b{color:var(--navy);}
  .invoice-line{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line);}
  .invoice-line:last-of-type{border-bottom:0;}
  .invoice-total{display:flex; justify-content:space-between; font-weight:700; font-size:15.5px; padding-top:10px; margin-top:4px; border-top:2px solid var(--ink);}
  .qr-box{text-align:center; padding:14px; background:var(--blue-pale); border-radius:12px; margin-top:12px;}
  .qr-box canvas{border-radius:8px; background:#fff; padding:8px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .qr-ref{font-family:monospace; font-size:12px; color:var(--navy); margin-top:8px; letter-spacing:.02em;}
  .qr-caption{font-size:11.5px; color:var(--slate); margin-top:6px;}

  /* ---------- owner / admin dashboard ---------- */
  .dashboard{width:100%; max-width:1100px; background:#fff; border-radius:18px; box-shadow:0 16px 40px rgba(9,45,66,.10); border:1px solid var(--line); overflow:hidden; display:flex; min-height:640px;}
  .dash-nav{width:200px; background:var(--navy); flex-shrink:0; padding:22px 12px;}
  .dash-nav .brand{color:#fff; font-family:var(--font-display); font-weight:700; font-size:16px; padding:0 10px 20px;}
  .dash-nav button{display:block; width:100%; text-align:left; background:transparent; border:0; color:#B9D2DE; padding:11px 12px; border-radius:9px; font-size:14px; cursor:pointer; margin-bottom:3px;}
  .dash-nav button.active{background:rgba(255,255,255,.14); color:#fff; font-weight:600;}
  .dash-main{flex:1; padding:30px 32px; overflow-x:auto; min-width:0;}
  .dash-main h1{font-size:22px; color:var(--navy); margin-bottom:4px;}
  .dash-sub{color:var(--slate); font-size:13.5px; margin-bottom:22px;}
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:24px;}
  .kpi{border-left:3px solid var(--kpi-color, var(--navy)); background:#fbfdfd; border-radius:0 10px 10px 0; padding:14px 16px;}
  .kpi .num{font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--ink);}
  .kpi .lbl{font-size:12px; color:var(--slate); margin-top:2px;}
  .callout{background:var(--green-pale); border-radius:12px; padding:16px 18px; margin-bottom:26px; font-size:13.5px; line-height:1.55; color:#155343;}
  .callout b{color:var(--green);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11.5px; text-transform:none; color:var(--slate); font-weight:600; padding:0 12px 10px; border-bottom:1.5px solid var(--line);}
  td{padding:12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:0;}
  .table-card{border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .table-card table{margin:0;}
  .table-card th, .table-card td{padding-left:16px;}
  .section-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .section-header h3{font-size:15px; color:var(--navy);}
  .curric-lock-row{display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .curric-sub-row{display:flex; align-items:center; gap:9px; padding:7px 0 7px 30px; font-size:12.5px; color:var(--slate);}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:99px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* ---------- AI coaching intelligence ---------- */
  .ai-card{border-color:var(--blue); background:linear-gradient(180deg,#F5FAFC 0%, #fff 60%);}
  .ai-meta{font-size:11px; color:var(--slate); margin-bottom:10px;}
  .ai-label{display:block; font-size:11px; font-weight:700; color:var(--blue); margin:10px 0 4px; text-transform:none;}
  .ai-text{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12.5px; font-family:inherit; line-height:1.5; resize:vertical; min-height:58px; color:var(--ink);}
  .ai-badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color:var(--blue); background:var(--blue-pale); border-radius:6px; padding:2px 8px; margin-bottom:8px;}
  .spinner{display:inline-block; width:13px; height:13px; border:2px solid var(--blue-pale); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- lesson plan ---------- */
  .lp-field{margin-bottom:10px;}
  .lp-field b{display:block; font-size:11px; color:var(--navy); text-transform:none; margin-bottom:2px;}
  .lp-field span, .lp-field div.lp-val{font-size:12.5px; color:var(--ink); line-height:1.5;}
  .lp-steps{margin:2px 0 0; padding-left:18px; font-size:12.5px; line-height:1.6;}
  .lp-raw{white-space:pre-wrap; font-size:12.5px; line-height:1.6; font-family:inherit;}

  /* ---------- assessment check / promotion ---------- */
  .check-panel{background:var(--blue-pale); border:1.5px solid var(--blue); border-radius:12px; padding:14px; margin-bottom:14px;}
  .ready-banner{justify-content:space-between;}
  .btn-on-green{background:#fff; color:var(--green); border:0;}

  /* ---------- parent sub-tabs + roadmap ---------- */
  .subtab-row{display:flex; gap:8px; margin-bottom:16px;}
  .subtab{flex:1; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:9px; font-size:13px; font-weight:600; color:var(--slate); cursor:pointer; text-align:center;}
  .subtab.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .roadmap-row{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
  .roadmap-row:last-child{border-bottom:0;}
  .roadmap-dot{width:12px; height:12px; border-radius:50%; background:var(--line); margin-top:5px; flex-shrink:0;}
  .roadmap-row.done .roadmap-dot{background:var(--green);}
  .roadmap-row.current .roadmap-dot{background:var(--amber); box-shadow:0 0 0 4px var(--amber-pale);}
  .roadmap-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px;}
  .roadmap-top strong{font-size:13.5px;}
  .roadmap-blurb{font-size:12.5px; color:var(--slate); line-height:1.5;}

  /* ---------- calendar ---------- */
  .cal-nav{display:flex; justify-content:space-between; align-items:center;}
  .cal-nav button{border:0; background:var(--blue-pale); color:var(--navy); width:32px; height:32px; border-radius:8px; cursor:pointer; display:grid; place-items:center;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{text-align:center; font-size:10.5px; color:var(--slate); font-weight:700; padding-bottom:4px;}
  .cal-cell{aspect-ratio:1; border-radius:9px; border:1.5px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12.5px; cursor:pointer; background:#fff; gap:3px; min-height:40px;}
  .cal-cell.empty{visibility:hidden; cursor:default; border:0;}
  .cal-cell.today{border-color:var(--blue); border-width:2px; font-weight:700;}
  .cal-cell.selected{background:var(--navy); border-color:var(--navy); color:#fff;}
  .cal-cell .dot{width:5px; height:5px; border-radius:50%; background:var(--green);}
  .cal-cell.selected .dot{background:#fff;}
  .cal-cell.blocked{background:var(--red-pale); border-color:var(--red);}

  /* ---------- make-up credits ---------- */
  .credit-card{border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px;}
  .credit-card:last-child{margin-bottom:0;}
  .credit-row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; gap:8px;}
  .slot-row{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:9px 11px; margin-top:6px; cursor:pointer; font-size:12.5px;}
  .slot-row:hover{border-color:var(--blue);}
  .slot-meta{color:var(--slate); font-size:11px;}
  .cap-input{width:64px; border:1.5px solid var(--line); border-radius:6px; padding:5px 7px; font-size:13px; font-family:inherit;}

  /* ---------- weekly schedule grid (Outlook/When2Meet style) ---------- */
  .week-grid-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .week-grid{display:grid; grid-template-columns:52px repeat(7, minmax(64px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; min-width:560px;}
  .wg-corner{background:#fff;}
  .wg-daylabel{background:#fff; text-align:center; padding:7px 2px; font-size:11px; font-weight:700; color:var(--navy);}
  .wg-daylabel .dnum{font-size:14px;}
  .wg-hourlabel{background:#fff; text-align:right; padding:4px 8px; font-size:10px; color:var(--slate); white-space:nowrap;}
  .grid-cell{background:#fff; min-height:38px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; text-align:center; line-height:1.3; padding:2px;}
  .grid-cell.class-cell{background:var(--blue-pale); color:var(--navy); font-weight:700;}
  .grid-cell.available-cell{background:var(--green-pale); color:var(--green); cursor:pointer; font-weight:700;}
  .grid-cell.available-cell:hover{filter:brightness(0.96);}
  .grid-cell.booked-cell{background:#FDE9E2; color:var(--coral-dark); font-weight:700;}
  .grid-cell.empty-cell{cursor:pointer;}
  .grid-cell.empty-cell:hover{background:#F2F6F7;}
  .legend-dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}

  @media (max-width:760px){
    .dashboard{flex-direction:column;}
    .dash-nav{width:100%; display:flex; gap:4px; padding:14px; overflow-x:auto;}
    .dash-nav .brand{display:none;}
    .dash-nav button{white-space:nowrap; margin-bottom:0;}
    .dash-main{padding:20px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================== DATA ============================== */

const RATE = { kaihsu:70, kaiyang:40, oscar:40, anna:70, ella:45, oli:45 };
const STUDENTS = {
  kaihsu:{ name:'Kai Hsu', level:'Stage 1', parent:'Fiona', venue:"D'Leedon" },
  kaiyang:{ name:'Kai Yang', level:'Stage 1', parent:'Fiona', venue:"D'Leedon" },

// ---- date helpers (plain YYYY-MM-DD strings throughout) ----
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dayOfWeekOf(dateStr){ return parseDate(dateStr).getDay(); }
function addMonthsStr(dateStr, n){ const d = parseDate(dateStr); d.setMonth(d.getMonth()+n); return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function addDaysStr(dateStr, n){ const d = parseDate(dateStr); d.setDate(d.getDate()+n); return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function formatDateLabel(dateStr){ return parseDate(dateStr).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }); }
function monthLabel(y,m){ return new Date(y, m-1, 1).toLocaleDateString('en-GB', { month:'long', year:'numeric' }); }
function classesOnDate(dateStr){ return CLASSES.filter(c => c.dayOfWeek === dayOfWeekOf(dateStr)); }
function weekStartOf(dateStr){ return addDaysStr(dateStr, -dayOfWeekOf(dateStr)); } // Sunday on/before dateStr
function formatWeekLabel(ws){
  const a = parseDate(ws), b = parseDate(addDaysStr(ws,6));
  const fmt = d => d.toLocaleDateString('en-GB',{ day:'numeric', month:'short' });
  return fmt(a) + ' \u2013 ' + fmt(b) + ', ' + b.getFullYear();
}
function formatHourLabel(hour){
  const h = hour % 24, ampm = h>=12 ? 'PM':'AM', h12 = h%12===0 ? 12 : h%12;
  return h12 + ':00 ' + ampm;
}
function studentsForClassDate(classId, dateStr){
  const cls = CLASSES.find(c => c.id === classId);
  const regulars = cls.studentIds.map(id => ({ id, makeup:false }));
  const guests = makeupBookings.filter(b => b.classId === classId && b.date === dateStr).map(b => ({ id:b.studentId, makeup:true }));
  return regulars.concat(guests);
}

// ---- make-up credit ledger ----
// Rules: at most one credit issued per student per calendar month; each credit expires
// two months after the absence that earned it, if unused.
let makeupCredits = [];   // {id, studentId, issuedDate, expiresDate, status:'available'|'used', usedClassId, usedDate}
let makeupBookings = [];  // {creditId, studentId, classId, date}
let instructorBlockedDates = []; // dates excluded from the make-up finder, e.g. instructor unavailable

function issueMakeupCreditIfEligible(studentId, date){
  if (makeupCredits.some(c => c.studentId===studentId && c.issuedDate===date)) return; // already recorded for this absence
  const month = date.slice(0,7);
  const alreadyThisMonth = makeupCredits.some(c => c.studentId===studentId && c.issuedDate.slice(0,7)===month);
  if (alreadyThisMonth) return; // cap: one credit per student per month
  makeupCredits.push({ id:'mc-'+studentId+'-'+date, studentId, issuedDate:date, expiresDate:addMonthsStr(date,2), status:'available' });
}
function computeCreditStatus(c){
  if (c.status === 'used') return 'used';
  if (TODAY > c.expiresDate) return 'expired';
  return 'available';
}
function eligibleMakeupSlots(studentId, credit){
  const level = STUDENTS[studentId].level;
  const results = [];
  const horizon = credit.expiresDate < addDaysStr(TODAY,70) ? credit.expiresDate : addDaysStr(TODAY,70);
  for (let d = TODAY; d <= horizon; d = addDaysStr(d,1)){
    if (instructorBlockedDates.includes(d)) continue;
    const dow = dayOfWeekOf(d);
    CLASSES.forEach(cls => {
      if (cls.dayOfWeek !== dow) return;
      if (!cls.levels.includes(level)) return;
      if (cls.studentIds.includes(studentId)) return; // a make-up is an extra session, not just next week's own class
      const headcount = cls.studentIds.length + makeupBookings.filter(b => b.classId===cls.id && b.date===d).length;
      const spotsLeft = cls.capacity - headcount;
      if (spotsLeft <= 0) return;
      results.push({ classId:cls.id, label:cls.label, date:d, time:cls.time, venue:cls.venue, spotsLeft });
    });
  }
  return results;
}
function bookMakeup(studentId, creditId, classId, date){
  const credit = makeupCredits.find(c => c.id === creditId);
  if (!credit || computeCreditStatus(credit) !== 'available') return;
  credit.status = 'used';
  credit.usedClassId = classId;
  credit.usedDate = date;
  makeupBookings.push({ creditId, studentId, classId, date });
  markAttendance(studentId, date, 'makeup');
  toast('Make-up booked for ' + formatDateLabel(date) + '.');
}

// ---- coach's own make-up availability, When2Meet-style ----
// The coach paints hourly slots as free; these are independent of any recurring class,
// so ANY child with an available credit can book one, regardless of level — it's a
// personal 1:1 slot the coach is offering, not a seat in an existing group class.
let availableSlots = new Set();   // 'YYYY-MM-DD_HH'
let slotBookings = {};            // 'YYYY-MM-DD_HH' -> { studentId, creditId }

function bookAdHocMakeup(studentId, creditId, date, hour){
  const key = date + '_' + hour;
  if (!availableSlots.has(key) || slotBookings[key]) return;
  const credit = makeupCredits.find(c => c.id === creditId);
  if (!credit || computeCreditStatus(credit) !== 'available') return;
  credit.status = 'used';
  credit.usedDate = date;
  credit.usedHour = hour;
  credit.usedClassId = null;
  slotBookings[key] = { studentId, creditId };
  availableSlots.delete(key);
  markAttendance(studentId, date, 'makeup');
  toast('Make-up booked for ' + STUDENTS[studentId].name.split(' ')[0] + ', ' + formatDateLabel(date) + ' ' + formatHourLabel(hour) + '.');
}

function renderWeekGrid(weekStart, role){
  const days = [];
  for (let i=0;i<7;i++) days.push(addDaysStr(weekStart,i));
  const dowShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = `<div class="week-grid"><div class="wg-corner"></div>`;
  days.forEach(d => {
    const dt = parseDate(d);
    html += `<div class="wg-daylabel">${dowShort[dt.getDay()]}<br><span class="dnum">${dt.getDate()}</span></div>`;
  });
  for (let hour=GRID_START_HOUR; hour<GRID_END_HOUR; hour++){
    html += `<div class="wg-hourlabel">${formatHourLabel(hour)}</div>`;
    days.forEach(d => {
      const cls = classesOnDate(d).filter(c => Math.floor(c.startHour) === hour);
      const key = d + '_' + hour;
      if (cls.length){
        html += `<div class="grid-cell class-cell">${cls.map(c=>c.label).join(', ')}<span style="font-size:9px;">${cls[0].time}</span></div>`;
      } else if (slotBookings[key]){
        const st = STUDENTS[slotBookings[key].studentId];
        html += `<div class="grid-cell booked-cell" title="${st.name} \u2014 make-up">${st.name.split(' ')[0]}<span style="font-size:9px;">Make-up</span></div>`;
      } else if (availableSlots.has(key)){
        const act = role==='owner' ? `data-action="toggle-slot" data-date="${d}" data-hour="${hour}"` : `data-action="pick-slot" data-date="${d}" data-hour="${hour}"`;
        html += `<div class="grid-cell available-cell" ${act}>Free</div>`;
      } else {
        const act = role==='owner' ? `data-action="toggle-slot" data-date="${d}" data-hour="${hour}"` : '';
        html += `<div class="grid-cell empty-cell" ${act}></div>`;
      }
    });
  }
  html += `</div>`;
  return html;
}

function cloneTree(t){ return JSON.parse(JSON.stringify(t)); }
function blankTree(t){
  const c = cloneTree(t);
  c.sequences.forEach(seq => seq.criteria.forEach(cr => {
    if (!cr.timed) cr.checked = false;
    if (cr.subSkills) cr.subSkills.forEach(s => s.checked = false);
  }));
  return c;
}
function seedChecked(tree, ids){
  ids.forEach(id => { for (const seq of tree.sequences){ const c = seq.criteria.find(c=>c.id===id); if (c) c.checked = true; } });
  return tree;
}

/* ============================== CALCULATIONS ============================== */

function criterionPct(c){
  if (c.timed) return c.checked ? 100 : 0;
  if (!c.subSkills || c.subSkills.length === 0) return c.checked ? 100 : 0;
  const total = c.subSkills.reduce((s,x)=>s+x.weight,0);
  const done = c.subSkills.reduce((s,x)=>s+(x.checked?x.weight:0),0);
  return total ? Math.round(done/total*100) : 0;
}
function criterionAchieved(c){ return criterionPct(c) === 100; }
function sequencePct(seq){
  const arr = seq.criteria.map(criterionPct);
  return arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
}
function stagePct(stage){
  const arr = stage.sequences.flatMap(s=>s.criteria.map(criterionPct));
  return arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
}
function stageReady(stage){
  return stage.sequences.every(seq => seq.criteria.every(criterionAchieved));
}
function findCriterion(stage, id){
  for (const seq of stage.sequences){
    const c = seq.criteria.find(c=>c.id===id);
    if (c) return c;
  }
  return null;
}
function stageForStudent(studentId){
  return studentProgress[studentId];
}

function chargeableCount(studentId, period){
  return attendanceRecords.filter(r => r.studentId===studentId && r.date.startsWith(period) && BILLING_RULES[r.status].chargeable).length;
}
function invoiceForParent(parent, period){
  const children = parentChildren(parent);
  const lines = children.map(id => {
    const n = chargeableCount(id, period);
    return { studentId:id, name:STUDENTS[id].name, count:n, rate:RATE[id], amount:n*RATE[id] };
  });
  const total = lines.reduce((s,l)=>s+l.amount,0);
  return { parent, period, lines, total, ref:'INV-'+parent.toUpperCase()+'-'+period.replace('-','') };
}

function markAttendance(studentId, date, status){
  const existing = attendanceRecords.find(r=>r.studentId===studentId && r.date===date);
  const prevStatus = existing ? existing.status : null;
  if (existing) existing.status = status;
  else attendanceRecords.push({ studentId, date, status });

  const prevRule = prevStatus ? BILLING_RULES[prevStatus] : null;
  const newRule = BILLING_RULES[status];
  // If this exact absence is no longer credit-eligible (instructor corrected a mis-mark),
  // revoke the credit it earned, provided it hasn't already been used.
  if (prevRule && prevRule.credit && !newRule.credit){
    const idx = makeupCredits.findIndex(c => c.studentId===studentId && c.issuedDate===date && c.status==='available');
    if (idx > -1) makeupCredits.splice(idx,1);
  }
  // If this newly-marked status is credit-eligible, try to issue one (subject to the monthly cap).
  if (newRule.credit && !(prevRule && prevRule.credit)){
    issueMakeupCreditIfEligible(studentId, date);
  }
}
function attendanceStatus(studentId, date){
  const r = attendanceRecords.find(r=>r.studentId===studentId && r.date===date);
  return r ? r.status : null;
}

function renderCriterion(c, studentId){
  const pct = criterionPct(c);
  const achieved = criterionAchieved(c);
  const lockOrCheck = (!c.timed && (!c.subSkills || c.subSkills.length===0))
    ? `<div class="crit-check ${c.checked?'checked':''}" data-action="toggle-criterion" data-student="${studentId}" data-id="${c.id}">${c.checked?ICON.check:''}</div>`
    : `<div class="crit-lock" title="Official SwimSafer criterion \u2014 locked">${ICON.lock}</div>`;

  let extra = '';
  if (c.timed){
    extra = `<div class="timed-row">
      <input type="text" value="${c.recordedValue}" data-action="edit-timed" data-student="${studentId}" data-id="${c.id}" />
      <span class="threshold">target ${c.thresholdLabel}</span>
      <span class="pill ${achieved?'pill-green':'pill-amber'}">${achieved?'Pass':'Not yet'}</span>
    </div>`;
  } else if (c.subSkills && c.subSkills.length){
    extra = `<div class="sub-block">
      <div class="sub-block-label">${ICON.pencil} Your coaching breakdown \u2014 editable</div>
      ${c.subSkills.map(ss => `
        <div class="sub-row">
          <div class="sub-check ${ss.checked?'checked':''}" data-action="toggle-subskill" data-student="${studentId}" data-crit="${c.id}" data-sub="${ss.id}">${ss.checked?ICON.check:''}</div>
          <div class="sub-text">${ss.text}</div>
          ${ss.weight>1?`<div class="sub-weight">weight ${ss.weight}</div>`:''}
        </div>`).join('')}
    </div>
    <div class="crit-pct-tag">${pct}% of this skill demonstrated</div>`;
  }

  return `<div class="criterion">
    <div class="crit-top">
      ${lockOrCheck}
      <div class="crit-text">${c.text}${c.needsVerify?'<span class="verify-tag">wording pending verification against official card</span>':''}</div>
    </div>
    ${extra}
  </div>`;
}

function weakestArea(stage){

}

function renderLessonPlanCard(classId){
  const cls = CLASSES.find(c=>c.id===classId);

  if (!p){

function renderCreditsCard(childId){
  const childName = STUDENTS[childId].name.split(' ')[0];
  const credits = makeupCredits.filter(c => c.studentId === childId);
  if (!credits.length){
    return `<div class="card"><div class="kicker">${childName}'s make-up credits</div><p style="font-size:12.5px; color:var(--slate); line-height:1.5;">Earned automatically from a notified absence \u2014 up to one a month, and each one is valid for two months.</p></div>`;
  }
  const rows = credits.map(c => {
    const status = computeCreditStatus(c);
    const usedWhere = c.usedClassId ? (CLASSES.find(cl=>cl.id===c.usedClassId)||{}).label : (c.usedHour!=null ? formatHourLabel(c.usedHour)+' slot with your coach' : '');
    const pill = status==='available' ? `<span class="pill pill-green">Available</span>`
               : status==='used' ? `<span class="pill pill-slate">Used ${formatDateLabel(c.usedDate)}${usedWhere?' \u2014 '+usedWhere:''}</span>`
               : `<span class="pill pill-red">Expired</span>`;
    let body = `<div class="credit-row"><span>${childName} \u2014 earned ${formatDateLabel(c.issuedDate)} <span style="color:var(--slate);">\u00b7 valid until ${formatDateLabel(c.expiresDate)}</span></span>${pill}</div>`;
    if (status === 'available'){
      const open = state.parent.bookingCreditId === c.id;
      body += `<button class="btn btn-outline btn-sm" style="margin-top:8px;" data-action="toggle-book-credit" data-credit="${c.id}">${open?'Hide slots':'Book make-up'}</button>`;
      if (open){
        const slots = eligibleMakeupSlots(childId, c);
        body += slots.length
          ? slots.map(s => `<button class="slot-row" data-action="book-makeup" data-credit="${c.id}" data-student="${childId}" data-class="${s.classId}" data-date="${s.date}">
              <span>${formatDateLabel(s.date)} \u00b7 ${s.time}</span>
              <span class="slot-meta">${s.label} \u00b7 ${s.venue} \u00b7 ${s.spotsLeft} spot${s.spotsLeft===1?'':'s'} left</span>
            </button>`).join('')
          : `<p style="font-size:12px; color:var(--slate); margin-top:8px;">No other class at ${STUDENTS[childId].level} has room in the next couple of months \u2014 try the "Book a slot" tab for the coach's own availability instead.</p>`;
      }
    }
    return `<div class="credit-card">${body}</div>`;
  }).join('');
  return `<div class="card"><div class="kicker">${childName}'s make-up credits</div>${rows}</div>`;
}

function renderRoadmap(childId){
  const level = STUDENTS[childId].level;
  const idx = STAGE_ORDER.indexOf(level);
  return STAGE_ROADMAP.map(st => {
    const stIdx = STAGE_ORDER.indexOf(st.name);
    const status = stIdx < idx ? 'done' : stIdx === idx ? 'current' : 'upcoming';
    const pill = status==='done' ? `<span class="pill pill-green">${ICON.check} Done</span>`
               : status==='current' ? `<span class="pill pill-amber">Current</span>`
               : `<span class="pill pill-slate">Upcoming</span>`;
    return `<div class="roadmap-row ${status}">
      <div class="roadmap-dot"></div>
      <div style="flex:1;">
        <div class="roadmap-top"><strong>${st.name}</strong>${pill}</div>
        <p class="roadmap-blurb">${st.blurb}</p>
        ${!st.official ? `<span class="verify-tag" style="background:var(--blue-pale); color:var(--blue);">school level, not SwimSafer-official</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

        ${instructorBlockedDates.length ? `<div style="margin-top:12px;">${instructorBlockedDates.map(d => `<span class="pill pill-slate" style="margin:3px 4px 0 0;">${formatDateLabel(d)} <button data-action="unblock-date" data-date="${d}" style="border:0; background:none; cursor:pointer; margin-left:4px; color:var(--red); font-weight:700;">\u00d7</button></span>`).join('')}</div>` : ''}
      </div>`;
  }

  else if (tab === 'schedule'){
    main = `
      <h1>Schedule</h1>
      <div class="dash-sub">Your regular classes are shown in blue \u2014 fixed, not editable here. Click any open cell to mark yourself free for a make-up; parents see this exact grid and can book straight into it, for whichever of their children needs it.</div>
      <div class="cal-nav" style="max-width:640px; margin-bottom:14px;">
        <button data-action="week-prev">${ICON.back}</button>
        <h3 style="font-size:14px; color:var(--navy);">${formatWeekLabel(state.grid.weekStart)}</h3>
        <button data-action="week-next" style="transform:scaleX(-1);">${ICON.back}</button>
      </div>
      <div class="week-grid-wrap">${renderWeekGrid(state.grid.weekStart, 'owner')}</div>
      <div style="display:flex; gap:16px; margin-top:14px; font-size:12px; color:var(--slate); flex-wrap:wrap;">
        <span><span class="legend-dot" style="background:var(--blue-pale);"></span>Regular class</span>
        <span><span class="legend-dot" style="background:var(--green-pale);"></span>Free \u2014 open to book</span>
        <span><span class="legend-dot" style="background:#FDE9E2;"></span>Make-up booked</span>
      </div>`;
  }

  return `
  <div class="dashboard">
    <div class="dash-nav">
      <div class="brand">Owner</div>
      ${navBtn('overview','Overview')}
      ${navBtn('roster','Roster')}
      ${navBtn('billing','Billing')}
      ${navBtn('curriculum','Curriculum')}
      ${navBtn('venues','Venues')}
      ${navBtn('classes','Classes')}
      ${navBtn('schedule','Schedule')}
    </div>
    <div class="dash-main">${main}</div>
  </div>`;
}

function toast(msg){
  const t = document.getElementById('toast');

  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);

/* ============================== FAKE PAYNOW QR ============================== */

function seededRandom(seed){
  let h = 0;
  for (let i=0;i<seed.length;i++){ h = (Math.imul(31,h) + seed.charCodeAt(i)) | 0; }
  return function(){
    h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
    return ((h >>> 0) / 4294967295);
  };
}
function drawFakeQR(canvas, seedText){
  const size = 25, cell = 9;
  canvas.width = size*cell; canvas.height = size*cell;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const rand = seededRandom(seedText);
  const inFinder = (x,y) => {
    const zones = [[0,0],[size-7,0],[0,size-7]];
    return zones.some(([zx,zy]) => x>=zx && x<zx+7 && y>=zy && y<zy+7);
  };
  ctx.fillStyle = '#0A3D5C';
  for (let y=0;y<size;y++){
    for (let x=0;x<size;x++){
      if (inFinder(x,y)) continue;
      if (rand() > 0.56) ctx.fillRect(x*cell, y*cell, cell, cell);
    }
  }
  const drawFinder = (ox,oy) => {
    ctx.fillStyle = '#0A3D5C'; ctx.fillRect(ox*cell, oy*cell, 7*cell, 7*cell);
    ctx.fillStyle = '#fff'; ctx.fillRect((ox+1)*cell, (oy+1)*cell, 5*cell, 5*cell);
    ctx.fillStyle = '#0A3D5C'; ctx.fillRect((ox+2)*cell, (oy+2)*cell, 3*cell, 3*cell);
  };
  drawFinder(0,0); drawFinder(size-7,0); drawFinder(0,size-7);
}

/* ============================== EVENTS ============================== */

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'set-role'){ state.role = el.dataset.role; render(); }

  else if (action === 'nav'){ state.instructor.screen = el.dataset.to; state.instructor.checkingAssessment = false; render(); }

  else if (action === 'open-class'){ state.instructor.classId = el.dataset.id; state.instructor.screen = 'roster'; render(); }

  else if (action === 'open-day'){ state.instructor.selectedDate = el.dataset.date; state.instructor.screen = 'day'; render(); }

  else if (action === 'cal-prev' || action === 'cal-next'){
    const dir = action === 'cal-prev' ? -1 : 1;
    state.instructor.calMonth = addMonthsStr(state.instructor.calMonth+'-01', dir).slice(0,7);
    render();
  }

  else if (action === 'open-assess'){ state.instructor.studentId = el.dataset.student; state.instructor.screen = 'assess'; state.instructor.checkingAssessment = false; render(); }

  else if (action === 'start-check'){ state.instructor.checkingAssessment = true; render(); }

  else if (action === 'cancel-check'){ state.instructor.checkingAssessment = false; render(); }

  else if (action === 'confirm-promote'){
    const sid = el.dataset.student;
    const s = STUDENTS[sid];
    const idx = STAGE_ORDER.indexOf(s.level);
    const next = STAGE_ORDER[idx+1];
    if (next){
      const passedLevel = s.level;
      stageCompletions.push({ studentId:sid, stage:passedLevel, date:TODAY, result:'pass' });
      if (!progressHistory[sid]) progressHistory[sid] = [];
      progressHistory[sid].push({ level:passedLevel, progress:cloneTree(studentProgress[sid]) });
      s.level = next;
      studentProgress[sid] = blankTree(templateForLevel(next));
      delete state.aiSummaries[sid];
      state.instructor.checkingAssessment = false;
      render();
      if (passedLevel === 'Foundation 2'){
        toast('\uD83C\uDFC5 Ace Award earned! ' + s.name + ' moves on to Foundation 3.');
      } else {
        toast(s.name + ' passed the check \u2014 promoted to ' + next + '.');
      }
    }
  }

  else if (action === 'generate-summary'){
    generateAISummary(el.dataset.student);
  }

  else if (action === 'approve-summary'){
    const a = state.aiSummaries[el.dataset.student];
    if (a){ a.approved = true; render(); toast('Shared with parent.'); }
  }

  else if (action === 'generate-lessonplan'){
    generateLessonPlan(el.dataset.class);
  }

  else if (action === 'approve-lessonplan'){
    const p = state.lessonPlans[el.dataset.class];
    if (p){ p.approved = true; render(); toast('Lesson plan approved.'); }
  }

  else if (action === 'edit-lessonplan'){
    const p = state.lessonPlans[el.dataset.class];
    if (p){
      p.overrideText = flattenLessonPlan(p);
      render();
    }
  }

  else if (action === 'set-parent-tab'){ state.parent.tab = el.dataset.tab; render(); }

  else if (action === 'toggle-book-credit'){
    state.parent.bookingCreditId = state.parent.bookingCreditId === el.dataset.credit ? null : el.dataset.credit;
    render();
  }

  else if (action === 'book-makeup'){
    bookMakeup(el.dataset.student, el.dataset.credit, el.dataset.class, el.dataset.date);
    state.parent.bookingCreditId = null;
    render();
  }

  else if (action === 'block-date'){
    const input = document.getElementById('block-date-input');
    if (input && input.value && !instructorBlockedDates.includes(input.value)){
      instructorBlockedDates.push(input.value);
      render();
      toast('Blocked ' + formatDateLabel(input.value) + ' for make-ups.');
    }
  }

  else if (action === 'unblock-date'){
    instructorBlockedDates = instructorBlockedDates.filter(d => d !== el.dataset.date);
    render();
  }

  else if (action === 'week-prev' || action === 'week-next'){
    state.grid.weekStart = addDaysStr(state.grid.weekStart, action==='week-prev' ? -7 : 7);
    render();
  }

  else if (action === 'toggle-slot'){
    const key = el.dataset.date + '_' + el.dataset.hour;
    if (availableSlots.has(key)) availableSlots.delete(key); else availableSlots.add(key);
    render();
  }

  else if (action === 'pick-slot'){
    state.parent.pendingSlot = { date: el.dataset.date, hour: el.dataset.hour };
    render();
  }

  else if (action === 'cancel-slot-pick'){ state.parent.pendingSlot = null; render(); }

  else if (action === 'confirm-slot-booking'){
    const { date, hour } = state.parent.pendingSlot;
    const studentId = el.dataset.student;
    const credit = makeupCredits.find(c => c.studentId===studentId && computeCreditStatus(c)==='available');
    if (credit) bookAdHocMakeup(studentId, credit.id, date, Number(hour));
    state.parent.pendingSlot = null;
    render();
  }

  else if (action === 'regress-stage'){
    const sid = el.dataset.student;
    const hist = progressHistory[sid];
    if (hist && hist.length){
      const snap = hist.pop();
      const student = STUDENTS[sid];
      const fromLevel = student.level;
      student.level = snap.level;
      studentProgress[sid] = snap.progress;
      stageCompletions.push({ studentId:sid, stage:fromLevel, date:TODAY, result:'regressed' });
      delete state.aiSummaries[sid];
      render();
      toast(student.name + ' moved back to ' + snap.level + ' \u2014 promotion undone.');
    }
  }

  else if (action === 'toggle-offline'){
    state.instructor.offline = !state.instructor.offline;
    if (!state.instructor.offline && state.instructor.queued > 0){
      toast('Syncing ' + state.instructor.queued + ' change' + (state.instructor.queued===1?'':'s') + '\u2026');
      setTimeout(()=>{ state.instructor.queued = 0; render(); toast('All changes saved.'); }, 900);
    }
    render();
  }

  else if (action === 'mark-attendance'){
    markAttendance(el.dataset.student, state.instructor.selectedDate, el.dataset.status);
    if (state.instructor.offline) state.instructor.queued++;
    render();
  }

  else if (action === 'toggle-criterion'){
    const c = findCriterion(stageForStudent(el.dataset.student), el.dataset.id);
    c.checked = !c.checked;
    if (state.instructor.offline) state.instructor.queued++;
    render();
  }

  else if (action === 'toggle-subskill'){
    const c = findCriterion(stageForStudent(el.dataset.student), el.dataset.crit);
    const ss = c.subSkills.find(s=>s.id===el.dataset.sub);
    ss.checked = !ss.checked;
    if (state.instructor.offline) state.instructor.queued++;
    render();
  }

  else if (action === 'select-child'){ state.parent.childId = el.dataset.id; render(); }

  else if (action === 'show-qr'){
    const slot = document.getElementById('qr-slot');
    const invoice = invoiceForParent('Aileen','2026-08');
    slot.innerHTML = `<div class="qr-box">
        <canvas id="qr-canvas"></canvas>
        <div class="qr-ref">${invoice.ref}</div>
        <div class="qr-caption">Scan with any Singapore banking app \u2014 DBS, OCBC, UOB, and more. Amount and reference are already filled in.</div>
        <div class="qr-caption" style="margin-top:6px;">Lincoln confirms once the transfer lands \u2014 this updates automatically for you.</div>
      </div>`;
    drawFakeQR(document.getElementById('qr-canvas'), invoice.ref);
  }

  else if (action === 'set-owner-tab'){ state.owner.tab = el.dataset.tab; render(); }

  else if (action === 'set-curriculum-level'){ state.owner.curriculumLevel = el.dataset.level; render(); }

  else if (action === 'generate-invoices'){
    state.invoicesGenerated = true;
    ['Aileen','Fiona','Wang','Matija'].forEach(p => { if (!state.invoiceStatus[p]) state.invoiceStatus[p] = 'pending'; });
    render();
    toast('4 invoices generated from August attendance.');
  }

  else if (action === 'mark-paid'){
    state.invoiceStatus[el.dataset.parent] = 'paid';
    render();
    toast('Marked ' + el.dataset.parent + '\u2019s invoice as paid.');
  }
});

document.addEventListener('change', function(e){
  if (e.target.dataset.action === 'edit-timed'){
    const c = findCriterion(stageForStudent(e.target.dataset.student), e.target.dataset.id);
    c.recordedValue = e.target.value;
    const parts = e.target.value.split(':').map(Number);
    const secs = (parts.length===2 ? parts[0]*60+parts[1] : NaN);
    c.checked = !isNaN(secs) && secs <= c.thresholdSec;
    render();
  }

  else if (e.target.dataset.action === 'edit-ai'){
    const a = state.aiSummaries[e.target.dataset.student];
    if (a) a[e.target.dataset.field] = e.target.value;
  }

  else if (e.target.dataset.action === 'edit-lp-raw'){
    const p = state.lessonPlans[e.target.dataset.class];
    if (p) p.overrideText = e.target.value;
  }

  else if (e.target.dataset.action === 'edit-capacity'){
    const cls = CLASSES.find(c => c.id === e.target.dataset.class);
    const v = parseInt(e.target.value, 10);
    if (cls && v > 0){ cls.capacity = v; render(); }
  }
});

/* ============================== AI COACHING INTELLIGENCE ============================== */
// Real calls to the Anthropic Messages API. In the claude.ai artifact runtime this is
// authenticated automatically; in other environments (e.g. this file opened standalone)
// the fetch will fail and the UI falls back to its error state below.

async function callClaude(prompt){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{ role:'user', content: prompt }],
    }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const text = (data.content || []).map(b => b.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

async function generateAISummary(studentId){
  const s = STUDENTS[studentId];
  const stage = stageForStudent(studentId);
  const achieved = [], developing = [];
  stage.sequences.forEach(seq => seq.criteria.forEach(c => {
    if (criterionAchieved(c)) achieved.push(c.text);
    else developing.push(c.text + (c.subSkills && c.subSkills.length ? ' (' + criterionPct(c) + '% of the coaching breakdown so far)' : ''));
  }));
  const records = attendanceRecords.filter(r => r.studentId === studentId);
  const attendanceText = records.map(r => r.date + ': ' + BILLING_RULES[r.status].label).join('; ') || 'no lessons logged yet';
  const sourcesLabel = 'assessment log (' + (achieved.length + developing.length) + ' criteria), attendance (' + records.length + ' lessons)';

  state.aiSummaries[studentId] = { loading:true };
  render();

  const prompt = `You are a coaching assistant for a children's swim school in Singapore following the SwimSafer 2.0 syllabus.
Student: ${s.name}, current stage: ${s.level}.
Achieved criteria: ${achieved.join('; ') || 'none yet'}.
Still developing: ${developing.join('; ') || 'none'}.
Attendance record: ${attendanceText}.

Write two short outputs and respond with ONLY valid JSON, no markdown fences, no preamble, in exactly this shape:
{"instructorSummary": "...", "parentSummary": "..."}

instructorSummary: 2-3 sentences, technical coaching language, naming a specific strength, a specific weakness, and one concrete recommended focus for the next lesson. Written for the instructor's own eyes.
parentSummary: 2-3 sentences, warm and encouraging, zero technical jargon, written directly to the parent about their child by name.`;

  try {
    const parsed = await callClaude(prompt);
    state.aiSummaries[studentId] = {
      instructorSummary: parsed.instructorSummary,
      parentSummary: parsed.parentSummary,
      generatedAt: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }),
      sources: sourcesLabel,
      approved: false,
    };
  } catch (err){
    state.aiSummaries[studentId] = { error:true };
  }
  render();
}

function flattenLessonPlan(p){
  return `Objective: ${p.objective}

Warm-up: ${p.warmup}

Progression:
${(p.progression||[]).map((s,i)=>(i+1)+'. '+s).join('\n')}

Grouping: ${p.grouping}
Equipment: ${p.equipment}
Coaching cues: ${p.coachingCues}
If they're struggling: ${p.contingency}
If they're ahead: ${p.stretch}
End-of-class review: ${p.review}`;
}

async function generateLessonPlan(classId){
  const cls = CLASSES.find(c => c.id === classId);
  const pool = POOL_PROFILES[cls.venue];
  const studentsInfo = cls.studentIds.map(id => {
    const st = STUDENTS[id];
    const stage = stageForStudent(id);
    return `${st.name} (${st.level}, ${stagePct(stage)}% through the stage, weakest area: ${weakestArea(stage)})`;
  }).join('; ');

  state.lessonPlans[classId] = { loading:true };
  render();

  const prompt = `You are a coaching assistant for a children's swim school in Singapore.
Class: ${cls.label} at ${cls.venue}, ${cls.time}.
Pool: ${pool.length_m}m x ${pool.width_m}m, depth ${pool.depth}, teaching zone: ${pool.teachingZone}, lanes: ${pool.lanes || 'none'}.
Equipment available: ${pool.equipment.join(', ')}.
Students attending: ${studentsInfo}.

Produce a realistic lesson plan for THIS specific group in THIS specific pool \u2014 not a generic swimming lesson. Respond with ONLY valid JSON, no markdown fences, no preamble, in exactly this shape:
{"objective":"...", "warmup":"...", "progression":["step 1 with rough timing","step 2 with rough timing","step 3 with rough timing"], "grouping":"...", "equipment":"...", "coachingCues":"...", "contingency":"...", "stretch":"...", "review":"..."}
Keep every field to 1-2 sentences except progression, which should be 3-5 short ordered steps.`;

  try {
    const parsed = await callClaude(prompt);
    state.lessonPlans[classId] = Object.assign({}, parsed, {
      generatedAt: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }),
      sources: cls.studentIds.length + ' students\u2019 progress, ' + cls.venue + ' pool profile',
      approved: false,
    });
  } catch (err){
    state.lessonPlans[classId] = { error:true };
  }
  render();
}

render();
